<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Work | Maysoon El-Masry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;500;600;700&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --purple-light: #f3e8ff;
            --purple-100: #e9d5ff;
            --purple-200: #d8b4fe;
            --purple-300: #c084fc;
            --purple-400: #a855f7;
            --purple-500: #9333ea;
            --purple-600: #7e22ce;
            --purple-dark: #581c87;
            --white: #ffffff;
            --off-white: #faf5ff;
            --text-dark: #1e1b2e;
            --text-muted: #6b7280;
            --gradient-1: linear-gradient(135deg, #c084fc 0%, #a855f7 50%, #7e22ce 100%);
            --gradient-2: linear-gradient(135deg, #e9d5ff 0%, #c084fc 50%, #a855f7 100%);
            --gradient-bg: linear-gradient(180deg, #faf5ff 0%, #f3e8ff 30%, #e9d5ff 60%, #faf5ff 100%);
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--gradient-bg);
            color: var(--text-dark);
            overflow-x: hidden;
            min-height: 100vh;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.3;
            animation: floatParticle linear infinite;
        }

        @keyframes floatParticle {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-100px) rotate(720deg); opacity: 0; }
        }

        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }

        .glow-orb-1 { width: 400px; height: 400px; background: var(--purple-300); top: -100px; right: -100px; animation: orbFloat1 8s ease-in-out infinite; }
        .glow-orb-2 { width: 300px; height: 300px; background: var(--purple-400); bottom: -50px; left: -50px; animation: orbFloat2 10s ease-in-out infinite; }
        .glow-orb-3 { width: 250px; height: 250px; background: var(--purple-200); top: 50%; left: 50%; animation: orbFloat3 12s ease-in-out infinite; }

        @keyframes orbFloat1 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-50px, 50px); } }
        @keyframes orbFloat2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(50px, -50px); } }
        @keyframes orbFloat3 { 0%, 100% { transform: translate(-50%, -50%); } 50% { transform: translate(-30%, -30%); } }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(20px);
            background: rgba(250, 245, 255, 0.7);
            border-bottom: 1px solid rgba(192, 132, 252, 0.2);
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        nav.scrolled {
            padding: 0.6rem 2rem;
            background: rgba(250, 245, 255, 0.9);
            box-shadow: 0 4px 30px rgba(147, 51, 234, 0.1);
        }

        .nav-logo {
            font-family: 'Pacifico', cursive;
            font-size: 1.5rem;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            cursor: pointer;
            transition: transform 0.3s ease;
            text-decoration: none;
        }

        .nav-logo:hover { transform: scale(1.05); }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 500;
            font-size: 0.95rem;
            position: relative;
            padding: 0.25rem 0;
            transition: color 0.3s ease;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0%;
            height: 2px;
            background: var(--gradient-1);
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        .nav-links a:hover { color: var(--purple-500); }
        .nav-links a:hover::after { width: 100%; }
        .nav-links a.active { color: var(--purple-500); }
        .nav-links a.active::after { width: 100%; }

        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 5px;
            z-index: 1001;
        }

        .hamburger span { width: 28px; height: 3px; background: var(--purple-500); border-radius: 3px; transition: all 0.3s ease; }
        .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(6px, 6px); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(6px, -6px); }

        .mobile-menu {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(250, 245, 255, 0.98);
            backdrop-filter: blur(20px);
            z-index: 999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 2rem;
        }

        .mobile-menu.active { display: flex; }

        .mobile-menu a {
            text-decoration: none;
            font-family: 'Fredoka One', cursive;
            font-size: 1.8rem;
            color: var(--purple-dark);
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(20px);
        }

        .mobile-menu.active a { opacity: 1; transform: translateY(0); }
        .mobile-menu a:nth-child(1) { transition-delay: 0.1s; }
        .mobile-menu a:nth-child(2) { transition-delay: 0.2s; }
        .mobile-menu a:nth-child(3) { transition-delay: 0.3s; }
        .mobile-menu a:hover { color: var(--purple-400); transform: scale(1.1); }

        section { position: relative; z-index: 1; }

        /* Gallery Page */
        .gallery-page {
            padding: 7rem 2rem 4rem;
            max-width: 1100px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            margin-bottom: 3rem;
        }

        .section-title h2 {
            font-family: 'Fredoka One', cursive;
            font-size: 2.8rem;
            margin-bottom: 0.5rem;
        }

        .section-title h2 .gradient-text {
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .section-title .subtitle {
            font-family: 'Pacifico', cursive;
            color: var(--purple-400);
            font-size: 1.1rem;
        }

        .section-title .underline {
            width: 80px;
            height: 4px;
            background: var(--gradient-1);
            border-radius: 2px;
            margin: 1rem auto 0;
        }

        .section-title .heading-desc {
            color: var(--text-muted);
            font-size: 1.05rem;
            max-width: 560px;
            margin: 1rem auto 0;
            line-height: 1.7;
            font-family: 'Poppins', sans-serif;
        }

        /* Pictures Grid */
        .pics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 2rem;
        }

        .pic-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 1rem;
            border: 1px solid rgba(192, 132, 252, 0.2);
            box-shadow: 0 4px 20px rgba(147, 51, 234, 0.06);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            opacity: 0;
            transform: translateY(40px);
            text-align: center;
        }

        .pic-card.visible { opacity: 1; transform: translateY(0); }

        .pic-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 15px 40px rgba(147, 51, 234, 0.15);
            border-color: var(--purple-300);
        }

        .pic-card:active { transform: translateY(-5px) scale(0.98); }

        .pic-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 14px;
            overflow: hidden;
            position: relative;
            background: var(--purple-100);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pic-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .pic-card:hover .pic-wrapper img { transform: scale(1.05); }

        .pic-label {
            font-family: 'Fredoka One', cursive;
            font-size: 0.95rem;
            color: var(--purple-dark);
            margin-top: 0.8rem;
        }

        .pic-caption {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.2rem;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 2000;
            align-items: center;
            justify-content: center;
            background: rgba(30, 27, 46, 0.85);
            backdrop-filter: blur(8px);
            padding: 2rem;
        }

        .lightbox.active { display: flex; }

        .lightbox-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modalPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .lightbox-content img {
            max-width: 90vw;
            max-height: 80vh;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .lightbox-caption {
            font-family: 'Fredoka One', cursive;
            color: white;
            margin-top: 1rem;
            font-size: 1rem;
        }

        .lb-close {
            position: absolute;
            top: -0.5rem;
            right: -0.5rem;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: var(--gradient-1);
            color: white;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .lb-close:hover { transform: scale(1.1); }

        .lb-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            color: var(--purple-500);
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .lb-nav:hover { background: var(--gradient-1); color: white; transform: translateY(-50%) scale(1.1); }

        .lb-prev { left: -1rem; }
        .lb-next { right: -1rem; }

        @media (max-width: 768px) {
            .nav-links { display: none; }
            .hamburger { display: flex; }
            .gallery-page { padding: 6rem 1.5rem 3rem; }
            .pics-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1.2rem; }
            .section-title h2 { font-size: 2.2rem; }
            .lb-prev { left: 0.25rem; }
            .lb-next { right: 0.25rem; }
        }

        @media (max-width: 480px) {
            .pics-grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        }
    </style>
</head>
<body>

    <div class="particles" id="particles"></div>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>
    <div class="glow-orb glow-orb-3"></div>

    <nav id="navbar">
        <a href="index.html" class="nav-logo">Maysoon</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="reels.html">Reels</a></li>
            <li><a href="pictures.html" class="active">Pictures</a></li>
        </ul>
        <div class="hamburger" id="hamburger">
            <span></span><span></span><span></span>
        </div>
    </nav>

    <div class="mobile-menu" id="mobileMenu">
        <a href="index.html" onclick="closeMenu()">Home</a>
        <a href="reels.html" onclick="closeMenu()">Reels</a>
        <a href="pictures.html" onclick="closeMenu()">Pictures</a>
    </div>

    <section class="gallery-page" id="pictures">
        <div class="section-title reveal">
            <h2 class="gradient-text">Visual Work</h2>
            <p class="subtitle">My Pictures</p>
            <p class="heading-desc">A collection of moments, visuals and creative work.</p>
            <div class="underline"></div>
        </div>

        <div class="pics-grid" id="picsGrid"></div>
    </section>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <div class="lightbox-content">
            <button class="lb-close" id="lbClose" aria-label="Close">&times;</button>
            <img id="lbImage" src="" alt="Preview">
            <div class="lightbox-caption" id="lbCaption"></div>
            <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous">&#8249;</button>
            <button class="lb-nav lb-next" id="lbNext" aria-label="Next">&#8250;</button>
        </div>
    </div>

    <footer>
        <div class="footer-logo">Maysoon El-Masry</div>
        <p>&copy; 2026 Maysoon El-Masry. All rights reserved.</p>
    </footer>

    <script>
        const hamburger = document.getElementById('hamburger');
        const mobileMenu = document.getElementById('mobileMenu');
        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('active');
            mobileMenu.classList.toggle('active');
            document.body.style.overflow = mobileMenu.classList.contains('active') ? 'hidden' : '';
        });
        function closeMenu() {
            hamburger.classList.remove('active');
            mobileMenu.classList.remove('active');
            document.body.style.overflow = '';
        }

        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => navbar.classList.toggle('scrolled', window.scrollY > 50));

        const revealElements = document.querySelectorAll('.reveal, .pic-card');
        const revealObserver = new IntersectionObserver((entries) => {
            entries.forEach((entry, index) => {
                if (entry.isIntersecting) {
                    setTimeout(() => entry.target.classList.add('visible'), index * 100);
                    revealObserver.unobserve(entry.target);
                }
            });
        }, { threshold: 0.15 });
        revealElements.forEach(el => revealObserver.observe(el));

        const particlesContainer = document.getElementById('particles');
        const colors = ['#c084fc', '#a855f7', '#d8b4fe', '#e9d5ff', '#7e22ce'];
        function createParticle() {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            const size = Math.random() * 8 + 3;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.background = colors[Math.floor(Math.random() * colors.length)];
            particle.style.animationDuration = Math.random() * 10 + 10 + 's';
            particle.style.animationDelay = Math.random() * 5 + 's';
            particlesContainer.appendChild(particle);
            setTimeout(() => particle.remove(), 20000);
        }
        setInterval(createParticle, 800);
        for (let i = 0; i < 15; i++) createParticle();

        // Lightbox logic
        const lightbox = document.getElementById('lightbox');
        const lbImage = document.getElementById('lbImage');
        const lbCaption = document.getElementById('lbCaption');
        const lbClose = document.getElementById('lbClose');
        const lbPrev = document.getElementById('lbPrev');
        const lbNext = document.getElementById('lbNext');

        // Build gallery from the pictures/ folder
        const picsGrid = document.getElementById('picsGrid');
        const picFiles = [];
        for (let i = 1; i <= 24; i++) picFiles.push('pictures/iamge%20(' + i + ').webp');
        let pics = [];

        picFiles.forEach((src, i) => {
            const card = document.createElement('div');
            card.className = 'pic-card';
            card.dataset.index = i;
            card.dataset.caption = 'Visual Work ' + (i + 1);
            card.innerHTML =
                '<div class="pic-wrapper"><img src="' + src + '" alt="Visual Work ' + (i + 1) + '"></div>' +
                '<div class="pic-label">Work ' + (i + 1) + '</div>' +
                '<div class="pic-caption">Maysoon El-Masry</div>';
            card.addEventListener('click', () => openLightbox(i));
            card.addEventListener('touchstart', function () { this.style.transform = 'scale(0.96)'; });
            card.addEventListener('touchend', function () { this.style.transform = ''; });
            picsGrid.appendChild(card);
        });

        pics = Array.from(document.querySelectorAll('.pic-card'));
        const current = { index: 0 };

        function openLightbox(index) {
            current.index = index;
            const pic = pics[index];
            const img = pic.querySelector('img');
            lbImage.src = img.src;
            lbCaption.textContent = pic.dataset.caption;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            lbImage.src = '';
            document.body.style.overflow = '';
        }

        function move(step) {
            current.index = (current.index + step + pics.length) % pics.length;
            const pic = pics[current.index];
            const img = pic.querySelector('img');
            lbImage.src = img.src;
            lbCaption.textContent = pic.dataset.caption;
        }

        lbClose.addEventListener('click', closeLightbox);
        lbPrev.addEventListener('click', () => move(-1));
        lbNext.addEventListener('click', () => move(1));

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });

        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') move(-1);
            if (e.key === 'ArrowRight') move(1);
        });

        // Reveal for dynamically created cards
        const dynamicCards = document.querySelectorAll('.pic-card');
        const dynamicObserver = new IntersectionObserver((entries) => {
            entries.forEach((entry, index) => {
                if (entry.isIntersecting) {
                    setTimeout(() => entry.target.classList.add('visible'), index * 80);
                    dynamicObserver.unobserve(entry.target);
                }
            });
        }, { threshold: 0.15 });
        dynamicCards.forEach(el => dynamicObserver.observe(el));
    </script>
</body>
</html>
